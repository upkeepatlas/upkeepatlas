name: Build and quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Initial bootstrap. Commit package-lock.json after a verified install,
      # then switch this to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run check:seo
      - run: npm run check
      - name: Verify production-host SEO output
        env:
          PUBLIC_SITE_URL: https://upkeepatlas.pages.dev
        run: |
          npm run build
          npm run check:seo
